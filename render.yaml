services:
  - type: web
    name: recoveros-backend
    runtime: python
    runtimeVersion: 3.12.0
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements-prod.txt
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        scope: build,runtime
        value: postgresql://user:password@host:5432/recoveros
      - key: DEMO_MODE
        scope: build,runtime
        value: "true"
