[project]
name = "veyro"
version = "0.1.0"
description = "AI Revenue Recovery Portfolio Optimizer"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "psycopg2-binary==2.9.9",
    "pydantic==2.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
